<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnMyOwnTrip™ · {{evento.titulo}}</title>
<meta name="description" content="OnMyOwnTrip: tu guía turístico con inteligencia artificial, en el bolsillo. Presentación · {{evento.titulo}} · {{evento.lugar}}.">
<meta property="og:title" content="OnMyOwnTrip™ · Tu guía turístico con IA">
<meta property="og:description" content="{{cifras.destinos}} ciudades, {{cifras.paises}} países, más de {{cifras.lugares_num}} lugares narrados. {{evento.titulo}}.">
<meta property="og:image" content="https://onmyowntriptool.github.io/OnMyOwnTrip/presentacion/img/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B1630">
<link rel="icon" href="img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;600;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #070E20; overflow: hidden; }
  body { font-family: 'DM Sans', Arial, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-tap-highlight-color: transparent; }
  #viewport { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; overflow: hidden; box-shadow: 0 30px 120px rgba(0,0,0,.5); }

  .slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
    opacity: 0; visibility: hidden; transform: scale(1.015);
    transition: opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1), visibility 0s linear .7s; }
  .slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1), visibility 0s; z-index: 2; }
  .slide > * { position: relative; z-index: 1; }
  .slide ul { padding-left: 1.1em; }
  .slide li + li { margin-top: .45em; }
  .slide li::marker { color: #F5A524; }
  .slide table { border-collapse: collapse; width: 100%; }
  .slide th, .slide td { border: 1px solid #D9D0BF; padding: .35em .6em; text-align: left; vertical-align: top; }
  .slide th { background: #E9E3D8; font-weight: 600; }
  .slide a { text-decoration: none; }

  /* Luces de fondo que derivan despacio (solo decorativas) */
  .glow { position: absolute; z-index: 0; border-radius: 50%; pointer-events: none; filter: blur(60px); opacity: .55; }
  .glow.g1 { width: 720px; height: 720px; right: -160px; top: -220px; background: radial-gradient(circle, rgba(76,141,246,.45), transparent 65%); animation: drift1 22s ease-in-out infinite alternate; }
  .glow.g2 { width: 620px; height: 620px; left: -200px; bottom: -260px; background: radial-gradient(circle, rgba(245,165,36,.28), transparent 65%); animation: drift2 26s ease-in-out infinite alternate; }
  .glow.light.g1 { background: radial-gradient(circle, rgba(245,165,36,.22), transparent 65%); }
  .glow.light.g2 { background: radial-gradient(circle, rgba(76,141,246,.14), transparent 65%); }
  @keyframes drift1 { to { transform: translate(-140px, 120px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(160px, -90px) scale(1.08); } }

  /* Entrada escalonada al llegar a cada diapositiva */
  .slide .anim { opacity: 0; transform: translateY(26px); }
  .slide.active .anim { animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* Movimiento continuo y suave */
  .slide.active .k-phone { animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards var(--d,0ms), float 7s ease-in-out infinite calc(var(--d,0ms) + 900ms); filter: drop-shadow(0 30px 50px rgba(0,0,0,.35)); }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .slide.active .k-badge { animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards var(--d,0ms), sway 6s ease-in-out infinite calc(var(--d,0ms) + 800ms); transform-origin: 50% 0; filter: drop-shadow(0 12px 18px rgba(0,0,0,.4)); transition: filter .3s; }
  .k-badge:hover { filter: drop-shadow(0 12px 28px rgba(245,165,36,.55)); }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  .slide.active .k-icon { animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards var(--d,0ms), bob 4.5s ease-in-out infinite calc(var(--d,0ms) + 800ms); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-4deg); } }
  .slide.active .k-icon-img, .slide.active .k-qr { animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards var(--d,0ms); }
  .qr-card { animation: halo 3.2s ease-in-out infinite; }
  @keyframes halo { 0%,100% { box-shadow: 0 0 0 0 rgba(245,165,36,.0), 0 20px 60px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 14px rgba(245,165,36,.25), 0 20px 60px rgba(0,0,0,.35); } }
  .lift { transition: transform .35s ease, box-shadow .35s ease; }
  .lift:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(11,22,48,.18); }
  .tm { display: inline-block; animation: shine 4s ease-in-out infinite; }
  @keyframes shine { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* Barra de progreso y controles */
  #progress { position: fixed; left: 0; top: 0; height: 4px; background: linear-gradient(90deg, #F5A524, #FFD27A); width: 0; transition: width .6s cubic-bezier(.2,.7,.2,1); z-index: 20; }
  #controls { position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 6px; z-index: 20;
    background: rgba(11,22,48,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px; color: #F6F2EA; transition: opacity .5s; }
  body.idle #controls { opacity: 0; }
  #controls button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; }
  #controls button:hover { background: rgba(255,255,255,.12); }
  #controls svg { width: 20px; height: 20px; }
  #counter { font: 600 14px 'DM Sans', sans-serif; min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; color: #F6F2EA; font: 500 14px 'DM Sans', sans-serif;
    background: rgba(11,22,48,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 8px 16px; pointer-events: none; transition: opacity .8s; white-space: nowrap; }
  #hint.hide { opacity: 0; }
  #notes { position: fixed; left: 16px; right: 16px; bottom: 76px; max-width: 900px; margin: 0 auto; z-index: 20; display: none;
    background: rgba(11,22,48,.92); color: #E5EAF4; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 16px 20px; font: 400 16px/1.5 'DM Sans', sans-serif; }
  body.show-notes #notes { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="stage">
{{SLIDES}}
</div></div>
<div id="hint">Haz clic o usa las flechas para avanzar</div>
<div id="notes" aria-live="polite"></div>
<nav id="controls" aria-label="Controles de la presentación">
  <button id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <span id="counter">1 / {{N}}</span>
  <button id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <button id="fs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
</nav>
<script>
(() => {
  const NOTES = {{NOTES}};
  const stage = document.getElementById('stage');
  const slides = [...stage.querySelectorAll('.slide')];
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const notesEl = document.getElementById('notes');
  const hint = document.getElementById('hint');
  let cur = 0;

  // Escala el lienzo 1920x1080 para que quepa entero en cualquier pantalla.
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  };
  addEventListener('resize', fit); fit();

  // Preparación de cada diapositiva: luces de fondo, orden de entrada.
  slides.forEach((sl) => {
    const bg = sl.getAttribute('style') || '';
    const light = /background:#F6F2EA|background:#F5A524/.test(bg);
    sl.insertAdjacentHTML('afterbegin', '<div class="glow g1' + (light ? ' light' : '') + '"></div><div class="glow g2' + (light ? ' light' : '') + '"></div>');
    let i = 0;
    sl.querySelectorAll('h1,h2,h3,p,li,img,table,svg.k-icon').forEach((el) => {
      if (el.closest('.anim') && !el.matches('img,svg')) return;
      el.classList.add('anim');
      el.style.setProperty('--d', Math.min(i * 70, 1100) + 'ms');
      i++;
    });
    sl.querySelectorAll('div').forEach((d) => {
      const st = d.getAttribute('style') || '';
      if (/border-radius:24px/.test(st) && /background:#(FFFDF8|13254A|FBF3E2)/.test(st)) d.classList.add('lift');
    });
    sl.querySelectorAll('img.k-qr').forEach((q) => q.parentElement.classList.add('qr-card'));
    sl.querySelectorAll('img.k-icon').forEach((q) => q.classList.replace('k-icon', 'k-icon-img'));
  });
  document.querySelectorAll('h1 span').forEach((s) => { if (s.textContent === '™') s.classList.add('tm'); });

  const countUp = (sl) => {
    sl.querySelectorAll('[data-count]').forEach((el) => {
      const target = +el.dataset.count; const t0 = performance.now(); const dur = 1400;
      const tick = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  };

  const show = (n, push = true) => {
    n = Math.max(0, Math.min(slides.length - 1, n));
    slides[cur].classList.remove('active');
    cur = n;
    const sl = slides[cur];
    // Reinicia las animaciones de entrada aunque se vuelva a la misma.
    void sl.offsetWidth;
    sl.classList.add('active');
    countUp(sl);
    counter.textContent = (cur + 1) + ' / ' + slides.length;
    progress.style.width = ((cur + 1) / slides.length * 100) + '%';
    notesEl.textContent = NOTES[cur] || '';
    if (push) history.replaceState(null, '', '#' + (cur + 1));
  };
  const next = () => { hideHint(); show(cur + 1); };
  const prev = () => { hideHint(); show(cur - 1); };
  if (matchMedia('(pointer: coarse)').matches) hint.textContent = innerHeight > innerWidth ? 'Gira el móvil · toca o desliza para avanzar' : 'Toca o desliza para avanzar';
  let hintTimer = setTimeout(() => hint.classList.add('hide'), 4500);
  const hideHint = () => { clearTimeout(hintTimer); hint.classList.add('hide'); };

  // Clic: tercio izquierdo retrocede, el resto avanza.
  document.getElementById('viewport').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    (e.clientX < innerWidth * 0.25 ? prev : next)();
  });
  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('next').addEventListener('click', next);
  document.getElementById('fs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  });
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
  });
  // Deslizar en móvil.
  let tx = null, ty = null;
  addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', (e) => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); (dx < 0 ? next : prev)(); }
    tx = null;
  });
  // Los controles se ocultan si el ratón no se mueve.
  let idle;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2500); };
  addEventListener('mousemove', wake); wake();

  const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return Number.isFinite(n) ? n - 1 : 0; };
  addEventListener('hashchange', () => { if (fromHash() !== cur) show(fromHash(), false); });
  show(fromHash(), false);
})();
</script>
</body>
</html>
